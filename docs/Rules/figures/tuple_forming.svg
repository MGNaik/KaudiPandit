  <rect x="60" y="60" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><text x="100.0" y="46" font-family="Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="middle" >Moved together: tuple forms</text><use href="#piece-blue" xlink:href="#piece-blue" x="90.0" y="94.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="110.0" y="107.0"/><line x1="144" y1="100.0" x2="180" y2="100.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="200" y="94.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="220" y="107.0"/><text x="210" y="134.0" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" >moves as one tuple</text><rect x="400" y="60" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><text x="440.0" y="46" font-family="Arial, sans-serif" font-size="14" fill="#52514e" text-anchor="middle" >Moved separately: no tuple</text><use href="#piece-blue" xlink:href="#piece-blue" x="430.0" y="94.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="450.0" y="107.0"/><line x1="484" y1="86.0" x2="520" y2="86.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="542" y="86.0"/><text x="440.0" y="166" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" >other piece stays, still alone</text>
