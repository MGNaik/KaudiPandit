<svg width="100%" viewBox="0 0 780 325" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2A78D6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#008300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a8a8a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>

    <g id="piece-blue"><circle cx="0" cy="0" r="9" fill="#2A78D6" stroke="#1C5CAB" stroke-width="1.2"/></g>
  </defs>
  <text x="30" y="16" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">On a safe square, a tuple may split into smaller tuples</text><text x="260.0" y="34" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="220" y="44" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="220" y1="44" x2="300" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="44" x2="220" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="248.0" y="76.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="272.0" y="78.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="260.0" y="94.0"/><text x="260.0" y="140" font-family="Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle">3-tuple</text><text x="560.0" y="34" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">After</text><rect x="520" y="44" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="520" y1="44" x2="600" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="600" y1="44" x2="520" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="560.0" y="84.0"/><line x1="604" y1="84.0" x2="640" y2="84.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="656" y="78.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="676" y="91.0"/><text x="662" y="120.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">splits into a 2-tuple (leaves)</text><text x="662" y="138.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">and a 1-tuple (stays behind)</text><text x="30" y="191" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">Off a safe square: must move as one (splitting not allowed)</text><text x="260.0" y="209" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="220" y="219" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><use href="#piece-blue" xlink:href="#piece-blue" x="250.0" y="253.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="270.0" y="266.0"/><text x="560.0" y="209" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">After</text><rect x="520" y="219" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="604" y1="259.0" x2="640" y2="259.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="654" y="253.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="674" y="266.0"/><text x="664" y="285.0" font-family="Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">moves together, still one tuple</text>
</svg>