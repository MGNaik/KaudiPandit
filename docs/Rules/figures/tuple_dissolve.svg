  </defs>
  <text x="30" y="16" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">On a safe square: a tuple may split</text><text x="260.0" y="34" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="220" y="44" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="220" y1="44" x2="300" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="44" x2="220" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="250.0" y="78.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="270.0" y="91.0"/><text x="260.0" y="140" font-family="Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle">2-tuple</text><text x="560.0" y="34" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">After</text><rect x="520" y="44" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="520" y1="44" x2="600" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="600" y1="44" x2="520" y2="124" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="560.0" y="84.0"/><line x1="604" y1="84.0" x2="640" y2="84.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="658" y="84.0"/><text x="658" y="116.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">one piece leaves,</text><text x="658" y="134.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">one stays behind</text><text x="30" y="191" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">Splitting need not go all the way to single pieces</text><text x="260.0" y="209" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="220" y="219" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="220" y1="219" x2="300" y2="299" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="219" x2="220" y2="299" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="248.0" y="251.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="272.0" y="253.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="260.0" y="269.0"/><text x="260.0" y="315" font-family="Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle">3-tuple</text><text x="560.0" y="209" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">After</text><rect x="520" y="219" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="520" y1="219" x2="600" y2="299" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><line x1="600" y1="219" x2="520" y2="299" stroke="rgb(150,150,150)" stroke-width="1.5" stroke-linecap="round"/><use href="#piece-blue" xlink:href="#piece-blue" x="560.0" y="259.0"/><line x1="604" y1="259.0" x2="640" y2="259.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="656" y="253.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="676" y="266.0"/><text x="662" y="295.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">splits into a 2-tuple (leaves)</text><text x="662" y="313.0" font-family="Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">and a 1-tuple (stays behind)</text><text x="30" y="366" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">Off a safe square: must move as one (splitting not allowed)</text><text x="260.0" y="384" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="220" y="394" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><use href="#piece-blue" xlink:href="#piece-blue" x="250.0" y="428.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="270.0" y="441.0"/><text x="560.0" y="384" font-family="Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle">After</text><rect x="520" y="394" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><line x1="604" y1="434.0" x2="640" y2="434.0" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><use href="#piece-blue" xlink:href="#piece-blue" x="654" y="428.0"/><use href="#piece-blue" xlink:href="#piece-blue" x="674" y="441.0"/><text x="664" y="460.0" font-family="Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">moves together, still one tuple</text>
</svg>