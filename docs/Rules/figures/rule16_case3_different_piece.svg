  <text x="180.0" y="40" font-family="Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start">A different piece, elsewhere on the board</text><text x="260.0" y="60" font-family="Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle">Before</text><rect x="60" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="140" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="220" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="300" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="380" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="460" y="70" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><use href="#piece-blue" xlink:href="#piece-blue" x="100.0" y="110.0"/><line x1="100.0" y1="190" x2="490.0" y2="190" stroke="#2A78D6" stroke-width="2.2" marker-end="url(#arr-blue)"/><text x="300" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2A78D6" text-anchor="middle">throw 5</text><text x="260.0" y="220" font-family="Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle">After</text><rect x="60" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="140" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="220" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="300" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="380" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><rect x="460" y="230" width="80" height="80" fill="#ffffff" stroke="rgb(150,150,150)" stroke-width="1"/><use href="#piece-blue" xlink:href="#piece-blue" x="500.0" y="270.0"/><text x="30" y="344" font-family="Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">Option (a): the 2-away piece near the centre cannot use the 5 to land, but this piece can</text><text x="30" y="360" font-family="Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">move 5 squares along its ordinary path --- the player may choose to send the 5 here.</text>
